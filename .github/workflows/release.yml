name: Release

on:
  push:
    tags: [ 'v*', 'bridge-v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.4.2 (must match the plugin version)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin zip
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref_name, 'bridge-v') && !startsWith(github.event.inputs.tag, 'bridge-v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify plugin version matches the tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TAG="${TAG#v}"
          HEADER=$(grep -oP 'Version:\s*\K[0-9][0-9.]*' ai-site-assistant/ai-site-assistant.php)
          CONST=$(grep -oP "AISA_VERSION',\s*'\K[0-9][0-9.]*" ai-site-assistant/ai-site-assistant.php)
          echo "tag=$TAG  header=$HEADER  const=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag ($TAG) must match the Version header ($HEADER) and AISA_VERSION ($CONST)."
            exit 1
          fi

      - name: Build plugin zip (root = ai-site-assistant/)
        run: zip -rq ai-site-assistant.zip ai-site-assistant -x '*.DS_Store'

      - name: Create GitHub Release with the zip asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ai-site-assistant.zip
          generate_release_notes: true

  bridge-release:
    name: Publish bridge changelog entry
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref_name, 'bridge-v') || startsWith(github.event.inputs.tag, 'bridge-v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # php-mcp-bridge/ runs server-side on betranslated.us — there is no
      # plugin zip to build or version header to check here. This release
      # is a changelog marker only; it does NOT deploy anything.
      # make_latest: false is load-bearing -- AISA_Updater polls GitHub's
      # /releases/latest endpoint, which returns whichever release is most
      # recently flagged "latest", not the newest by semver. Without this,
      # a bridge tag (shipped far more often than plugin versions) becomes
      # "latest" with no ai-site-assistant.zip asset, so package_url()
      # comes back empty and check() silently skips the update -- the
      # Plugins screen shows nothing even when a real newer version exists.
      - name: Create GitHub Release (changelog only, no artifact)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: false
          body: |
            Changes to `php-mcp-bridge/` (the MCP bridge hosted on betranslated.us).

            This tag is a changelog marker only — it does not deploy anything.
            The bridge must be updated on the server separately.
