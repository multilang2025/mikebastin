# FTP_USERNAME must match hPanel's "Active hostname" table for the
# preview account exactly (e.g. u586375813.preview), not the string
# shown on the one-time account creation screen, which can differ.
name: Deploy preview

on:
  push:
    branches: [ main ]
    paths:
      - 'mb-master-revamp/site/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mb-master-revamp/site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mb-master-revamp/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Diagnose FTP login (temporary, remove once root-caused)
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "--- secret shape check, no content printed ---"
          echo "FTP_HOST length: ${#FTP_HOST}"
          echo "FTP_USERNAME length: ${#FTP_USERNAME}"
          echo "FTP_PASSWORD length: ${#FTP_PASSWORD}"
          [[ "$FTP_USERNAME" =~ ^[[:space:]]|[[:space:]]$ ]] && echo "FTP_USERNAME has leading/trailing whitespace" || echo "FTP_USERNAME: no leading/trailing whitespace"
          [[ "$FTP_PASSWORD" =~ ^[[:space:]]|[[:space:]]$ ]] && echo "FTP_PASSWORD has leading/trailing whitespace" || echo "FTP_PASSWORD: no leading/trailing whitespace"
          [[ "$FTP_HOST" =~ ^[[:space:]]|[[:space:]]$ ]] && echo "FTP_HOST has leading/trailing whitespace" || echo "FTP_HOST: no leading/trailing whitespace"
          echo
          echo "--- plain FTP, verbose, list root ---"
          curl -v --connect-timeout 15 \
            -u "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_HOST/" || true
          echo
          echo "--- explicit FTPS, verbose, list root ---"
          curl -v --connect-timeout 15 --ftp-ssl --insecure \
            -u "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_HOST/" || true

      - name: Deploy to preview.mikebastin.com over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./mb-master-revamp/site/out/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
