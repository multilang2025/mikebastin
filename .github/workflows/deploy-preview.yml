name: Deploy preview

on:
  push:
    branches: [ main ]
    paths:
      - 'mb-master-revamp/site/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mb-master-revamp/site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mb-master-revamp/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to preview.mikebastin.com over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./mb-master-revamp/site/out/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
