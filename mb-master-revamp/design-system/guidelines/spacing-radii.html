<!-- @dsCard group="Spacing" viewport="700x140" name="Radii" subtitle="3px chips, 4px cards, pill only for filters. Near-square by default" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="band band-b">
  <div class="card" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <span style="display:grid;place-items:center;width:74px;height:44px;border:1px solid var(--rule);border-radius:3px;font-size:.7rem;color:var(--dim)">3px</span>
    <span style="display:grid;place-items:center;width:74px;height:44px;border:1px solid var(--rule);border-radius:4px;font-size:.7rem;color:var(--dim)">4px</span>
    <span style="display:grid;place-items:center;width:110px;height:34px;border:1px solid var(--berry);border-radius:999px;font-size:.7rem;color:var(--berry)">999px</span>
    <span class="caps">chip &middot; card &middot; filter pill</span>
  </div>
</body>
</html>
