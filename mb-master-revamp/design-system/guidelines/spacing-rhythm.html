<!-- @dsCard group="Spacing" viewport="700x200" name="Shell and band rhythm" subtitle="min(1180px, 86vw), band padding clamp(64px, 9vw, 128px)" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Rhythm</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="band band-b">
  <div class="card">
    <div style="border:1px dashed var(--rule);border-radius:4px;padding:10px;margin-bottom:12px">
      <div style="height:14px;background:var(--chip);border-radius:2px"></div>
      <p class="caps" style="margin:8px 0 0">shell &middot; min(1180px, 86vw), centred</p>
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><div style="height:34px;background:var(--berry-soft);border-radius:2px"></div><p class="caps" style="margin:7px 0 0">band-py</p></div>
      <div style="flex:1"><div style="height:24px;background:var(--berry-soft);border-radius:2px"></div><p class="caps" style="margin:7px 0 0">band-py-sm</p></div>
      <div style="flex:1"><div style="height:46px;background:var(--berry-soft);border-radius:2px"></div><p class="caps" style="margin:7px 0 0">hero-pt</p></div>
    </div>
  </div>
</body>
</html>
