<!-- @dsCard group="Brand" viewport="700x160" name="Grain" subtitle="Inline SVG noise at 3.5%, overlay blend. Depth without a raster asset" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Grain</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="band band-b grain" style="position:relative">
  <div class="card" style="position:relative">
    <p style="margin:0 0 6px;font-size:1.05rem">The same band, with .grain on it.</p>
    <p style="margin:0;font-size:.9rem;color:var(--dim)">Keep it on hero and other large flat bands: it is doing real work there.</p>
  </div>
</body>
</html>
