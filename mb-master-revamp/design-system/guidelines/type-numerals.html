<!-- @dsCard group="Type" viewport="700x150" name="Numerals" subtitle="Figures are tabular; Roman numerals mark the eight spreads" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Numerals</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="band band-b">
  <div class="card" style="display:flex;align-items:baseline;gap:32px;flex-wrap:wrap">
    <span class="display" style="font-size:2rem;font-weight:600;color:var(--berry);font-variant-numeric:tabular-nums">18,522</span>
    <span class="display" style="font-size:2rem;font-weight:600;color:var(--berry);font-variant-numeric:tabular-nums">2,399,567</span>
    <span class="display" style="font-size:1.5rem;font-weight:500;color:var(--berry)">I. II. III. IV.</span>
    <span class="caps">tabular-nums everywhere a figure carries a claim</span>
  </div>
</body>
</html>
