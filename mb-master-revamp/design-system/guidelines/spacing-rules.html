<!-- @dsCard group="Spacing" viewport="700x160" name="Hairlines" subtitle="1px --rule for every divider, table border and grid gap" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Hairlines</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="band band-b">
  <div class="card">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule)">
      <div class="band band-b" style="padding:16px 14px"><span class="display" style="color:var(--berry);font-size:1.3rem;font-weight:600">25</span><div class="caps" style="margin-top:6px">Years</div></div>
      <div class="band band-b" style="padding:16px 14px"><span class="display" style="color:var(--berry);font-size:1.3rem;font-weight:600">8</span><div class="caps" style="margin-top:6px">Projects</div></div>
      <div class="band band-b" style="padding:16px 14px"><span class="display" style="color:var(--berry);font-size:1.3rem;font-weight:600">12</span><div class="caps" style="margin-top:6px">Domains</div></div>
    </div>
    <p class="caps" style="margin:12px 0 0">a 1px gap over --rule is the grid; no borders drawn per cell</p>
  </div>
</body>
</html>
