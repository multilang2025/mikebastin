<!-- @dsCard group="Colors" viewport="700x200" name="Bands alternate" subtitle="Sections carry the tokens; components read variable names only" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Bands</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="band band-b" style="padding:20px 26px">
    <p class="eyebrow" style="margin:0 0 6px">Reading the swell</p>
    <p style="margin:0;font-size:.92rem">Night Swell, <span style="color:var(--dim)">dim text alongside</span></p>
  </div>
  <div class="band band-a" style="padding:20px 26px">
    <p class="eyebrow" style="margin:0 0 6px">Reading the swell</p>
    <p style="margin:0;font-size:.92rem">Morning Glass, <span style="color:var(--dim)">dim text alongside</span></p>
  </div>
</body>
</html>
