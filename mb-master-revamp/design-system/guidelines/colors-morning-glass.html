<!-- @dsCard group="Colors" viewport="700x150" name="Morning Glass" subtitle="The light ground, .band-a by default" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Morning Glass</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="band band-a">
  <div class="card row">
    <div class="sw"><i style="background:var(--bg)"></i><b>bg</b><span>#F5F0E4</span></div>
    <div class="sw"><i style="background:var(--ink)"></i><b>ink</b><span>#0F2837</span></div>
    <div class="sw"><i style="background:var(--dim)"></i><b>dim</b><span>#58707F</span></div>
    <div class="sw"><i style="background:var(--rule)"></i><b>rule</b><span>ink 16%</span></div>
    <div class="sw"><i style="background:var(--chip)"></i><b>chip</b><span>ink 5.5%</span></div>
    <div class="sw"><i style="background:var(--shade)"></i><b>shade</b><span>ink 4%</span></div>
  </div>
</body>
</html>
