<!-- @dsCard group="Colors" viewport="700x180" name="Berry, the only accent" subtitle="Focus, selection, eyebrow, one shimmer. Resolves per band" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Berry</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="band band-b">
  <div class="card">
    <div class="row" style="margin-bottom:14px">
      <div class="sw"><i style="background:var(--berry)"></i><b>berry</b><span>#F2556A</span></div>
      <div class="sw"><i style="background:var(--berry-deep)"></i><b>berry deep</b><span>#C9304A</span></div>
      <div class="sw"><i style="background:var(--berry-soft)"></i><b>berry soft</b><span>berry 13%</span></div>
      <div class="sw"><i style="background:var(--glow)"></i><b>glow</b><span>berry 14%</span></div>
    </div>
    <div class="band band-a" style="padding:12px 14px;border-radius:4px">
      <div class="row">
        <div class="sw"><i style="background:var(--berry)"></i><b>berry</b><span>#C42640</span></div>
        <div class="sw"><i style="background:var(--berry-deep)"></i><b>berry deep</b><span>#9E1B31</span></div>
        <div class="sw"><i style="background:var(--berry-soft)"></i><b>berry soft</b><span>berry 10%</span></div>
        <div class="sw"><i style="background:var(--glow)"></i><b>glow</b><span>berry 9%</span></div>
      </div>
    </div>
  </div>
</body>
</html>
