<!-- @dsCard group="Colors" viewport="700x150" name="Gold, silver, deep" subtitle="Secondary, used sparingly. Gold draws the swell, silver the second line" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Secondary</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="band band-b">
  <div class="card row">
    <div class="sw"><i style="background:var(--gold)"></i><b>gold</b><span>#D9A94A</span></div>
    <div class="sw"><i style="background:var(--gold-soft)"></i><b>gold soft</b><span>#E8CD7A</span></div>
    <div class="sw"><i style="background:var(--silver)"></i><b>silver</b><span>#BCC9D3</span></div>
    <div class="sw"><i style="background:var(--deep)"></i><b>deep</b><span>#155268</span></div>
  </div>
</body>
</html>
