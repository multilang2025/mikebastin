<!-- @dsCard group="Type" viewport="700x240" name="Type scale" subtitle="Fluid clamps, no breakpoints. Hero, h1, quote, h2, lede, body" -->
<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<title>Scale</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; }
  .card { padding: 22px 26px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 84px; }
  .sw i { display: block; height: 46px; border-radius: 4px; border: 1px solid var(--rule); }
  .sw b { display: block; margin-top: 7px; font-size: .68rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .sw span { display: block; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="band band-b">
  <div class="card" style="display:flex;flex-direction:column;gap:8px">
    <span class="display" style="font-size:2.4rem;font-weight:600;line-height:1">Hero <span style="font-size:.6rem;color:var(--dim);letter-spacing:.06em">clamp(2.7rem, 7.4vw, 5.6rem)</span></span>
    <span class="display" style="font-size:1.8rem;font-weight:600;line-height:1">H1 <span style="font-size:.6rem;color:var(--dim);letter-spacing:.06em">clamp(2.3rem, 5.6vw, 4rem)</span></span>
    <span class="display" style="font-size:1.4rem;font-weight:600;line-height:1">H2 <span style="font-size:.6rem;color:var(--dim);letter-spacing:.06em">clamp(1.8rem, 3.6vw, 2.9rem)</span></span>
    <span style="font-size:1.1rem">Lede <span style="font-size:.6rem;color:var(--dim);letter-spacing:.06em">clamp(1.05rem, 1.65vw, 1.24rem)</span></span>
    <span style="font-size:1.05rem">Body <span style="font-size:.6rem;color:var(--dim);letter-spacing:.06em">1.05rem / 350</span></span>
    <span class="caps">Caps label &middot; 0.72rem &middot; tracking 0.11em</span>
  </div>
</body>
</html>
