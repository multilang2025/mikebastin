<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="800x600">
<link rel="stylesheet" href="../kit.css"><style>:root{--w:800px;--h:600px}</style></head><body>
<!-- Lead generation: enquiries counted per market, arriving as they happen.
     Bars carry no numbers on purpose: an illustration, never a client result. -->
<div class="card pad abs" style="left:4px;top:10px;width:500px">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div class="h serif">Enquiries by market</div>
    <div style="display:flex;gap:6px"><span class="lang">Month</span><span class="lang" style="background:var(--chip);color:var(--dim)">Quarter</span></div>
  </div>
  <div class="bars" style="margin-top:22px">
    <div class="row">France<div class="track"><div class="fill" style="width:78%"></div></div></div>
    <div class="row">Germany<div class="track"><div class="fill berry" style="width:92%"></div></div></div>
    <div class="row">Spain<div class="track"><div class="fill" style="width:64%"></div></div></div>
    <div class="row">Netherlands<div class="track"><div class="fill" style="width:48%"></div></div></div>
    <div class="row">Belgium<div class="track"><div class="fill" style="width:40%"></div></div></div>
    <div class="row">UK<div class="track"><div class="fill" style="width:70%"></div></div></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:22px"><span class="pill">Form</span><span class="pill">Call</span><span class="pill berry">Quote request</span></div>
</div>

<div class="card toast abs" style="left:420px;top:150px;width:370px">
  <span class="dot"></span><div><b>New quote request</b><small>Germany, from the German service page</small></div>
</div>
<div class="card toast abs" style="left:450px;top:238px;width:340px">
  <span class="dot ok"></span><div><b>New enquiry</b><small>France, from a French search</small></div>
</div>
<div class="card deep pad abs" style="left:330px;top:400px;width:460px">
  <div class="h" style="color:var(--cream);opacity:.8">Sent to your CRM</div>
  <div style="font:600 22px/1.3 'Fraunces';margin-top:6px">Every enquiry tagged with the market and the language that brought it</div>
</div>
</body></html>
