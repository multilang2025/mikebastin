<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="800x600">
<link rel="stylesheet" href="../kit.css"><style>:root{--w:800px;--h:600px}
.q{font:500 17px/1.45 'Inter';background:var(--chip);border-radius:14px 14px 4px 14px;padding:12px 16px;margin-left:auto;width:fit-content;max-width:86%}
.mt{font:400 17px/1.65 'Inter'}
</style></head><body>
<!-- AI: an answer engine citing the page, and machine output corrected by a
     native editor. Generic assistant UI, no product brand. -->
<div class="card pad abs" style="left:4px;top:10px;width:500px">
  <div class="q">Which agency can run our SEO in German and Dutch?</div>
  <div style="display:flex;gap:12px;margin-top:16px;align-items:flex-start">
    <svg width="26" height="26" viewBox="0 0 26 26" style="flex:none"><path d="M13 2 L15.5 10.5 L24 13 L15.5 15.5 L13 24 L10.5 15.5 L2 13 L10.5 10.5 Z" fill="var(--berry)"/></svg>
    <div style="flex:1"><div class="line ink" style="width:92%;margin-top:4px"></div><div class="line" style="width:97%"></div><div class="line" style="width:70%"></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><span class="pill berry" style="height:30px;font-size:14px">yoursite.com/de/</span><span class="pill" style="height:30px;font-size:14px">yoursite.com/nl/</span></div></div>
  </div>
</div>

<div class="card pad abs" style="left:290px;top:300px;width:504px">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="h">Post-edited by a native speaker</div><span class="lang">DE</span></div>
  <div class="mt" style="margin-top:12px"><span class="strike">Die Lieferung erfolgt in 24 Stunden.</span></div>
  <div class="mt"><span class="fix">Wir liefern innerhalb eines Werktags.</span></div>
  <div class="mt" style="margin-top:6px"><span class="strike">Kontaktieren Sie uns für Preis.</span></div>
  <div class="mt"><span class="fix">Fordern Sie Ihr Angebot an.</span></div>
</div>

<div class="pill deep abs" style="left:20px;top:340px">Cited in AI answers</div>
<div class="pill abs" style="left:20px;top:392px">Checked by native readers</div>
</body></html>
