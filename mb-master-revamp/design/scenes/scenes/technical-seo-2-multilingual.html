<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="800x600">
<link rel="stylesheet" href="../kit.css"><style>:root{--w:800px;--h:600px}
.ver{position:absolute;top:150px;width:144px;height:210px;padding:16px 14px}
.ver .p{font:600 14px "Inter";margin-top:12px;color:var(--ink)}
.ver .f{display:block;margin-top:14px;font:500 13px "Inter";padding:4px 5px;white-space:nowrap;border-radius:6px;background:var(--chip);border:1px solid var(--rule);color:var(--dim);width:fit-content}
.by{position:absolute;top:442px;width:144px;text-align:center;font:600 15px "Inter";color:var(--ink)}
.by .av{width:56px;height:56px;border-radius:50%;background:var(--deep);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 10px 22px rgb(10 27 40 / .22)}
.by .lb{display:inline-block;margin-top:0;padding:6px 12px;border-radius:999px;background:var(--cream);border:1px solid var(--rule);font:600 14px "Inter";color:var(--ink);box-shadow:0 8px 20px rgb(10 27 40 / .14);white-space:nowrap}
.by span{display:block;font:400 14px "Inter";color:var(--dim);margin-top:2px}
</style></head><body>
<!-- Language versions pointing to each other, each with its own address and
     sitemap, each reaching its own buyers. Illustrative only. -->

<svg class="abs" style="left:0;top:0" width="800" height="600">
  <path class="link" d="M110 150 C 120 96, 194 96, 204 150"/>
  <path class="link" d="M272 150 C 282 96, 356 96, 366 150"/>
  <path class="link" d="M434 150 C 444 96, 518 96, 528 150"/>
  <path class="link" d="M596 150 C 606 96, 680 96, 690 150"/>
  <path class="link" d="M52 150 C 60 36, 740 36, 748 150"/>
  <path class="solid" d="M76 436 L76 374 M238 436 L238 374 M400 436 L400 374 M562 436 L562 374 M724 436 L724 374"/>
  <path d="M76 372 l-6 10 h12 z M238 372 l-6 10 h12 z M400 372 l-6 10 h12 z M562 372 l-6 10 h12 z M724 372 l-6 10 h12 z" fill="var(--deep)"/>
</svg>
<div class="pill berry abs" style="left:270px;top:50px;height:34px">Each version names the others</div>

<div class="card ver" style="left:4px"><span class="lang">EN</span><div class="p">yoursite.com/en/</div><div class="line ink" style="width:74%;margin-top:16px"></div><div class="line" style="width:92%"></div><span class="f">sitemap-en.xml</span></div>
<div class="card ver" style="left:166px"><span class="lang">FR</span><div class="p">yoursite.com/fr/</div><div class="line ink" style="width:78%;margin-top:16px"></div><div class="line" style="width:94%"></div><span class="f">sitemap-fr.xml</span></div>
<div class="card ver" style="left:328px"><span class="lang">ES</span><div class="p">yoursite.com/es/</div><div class="line ink" style="width:74%;margin-top:16px"></div><div class="line" style="width:92%"></div><span class="f">sitemap-es.xml</span></div>
<div class="card ver" style="left:490px"><span class="lang">DE</span><div class="p">yoursite.com/de/</div><div class="line ink" style="width:70%;margin-top:16px"></div><div class="line" style="width:90%"></div><span class="f">sitemap-de.xml</span></div>
<div class="card ver" style="left:652px"><span class="lang">NL</span><div class="p">yoursite.com/nl/</div><div class="line ink" style="width:66%;margin-top:16px"></div><div class="line" style="width:88%"></div><span class="f">sitemap-nl.xml</span></div>

<div class="by" style="left:4px"><div class="av"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="var(--cream)"/><path d="M3 22 C3 15 21 15 21 22 Z" fill="var(--cream)"/></svg></div><span class="lb">US and UK buyer</span></div>
<div class="by" style="left:166px"><div class="av"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="var(--cream)"/><path d="M3 22 C3 15 21 15 21 22 Z" fill="var(--cream)"/></svg></div><span class="lb">French buyer</span></div>
<div class="by" style="left:328px"><div class="av"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="var(--cream)"/><path d="M3 22 C3 15 21 15 21 22 Z" fill="var(--cream)"/></svg></div><span class="lb">Spanish buyer</span></div>
<div class="by" style="left:490px"><div class="av"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="var(--cream)"/><path d="M3 22 C3 15 21 15 21 22 Z" fill="var(--cream)"/></svg></div><span class="lb">German buyer</span></div>
<div class="by" style="left:652px"><div class="av"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="var(--cream)"/><path d="M3 22 C3 15 21 15 21 22 Z" fill="var(--cream)"/></svg></div><span class="lb">Dutch buyer</span></div>
</body></html>
