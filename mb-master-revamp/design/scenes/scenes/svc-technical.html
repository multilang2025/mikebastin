<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="800x600">
<link rel="stylesheet" href="../kit.css"><style>:root{--w:800px;--h:600px}
.node{position:absolute;padding:10px 16px;font:600 16px 'Inter'}
.cwv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;font:500 15px 'Inter'}
.cwv b{font:700 17px 'Inter';color:var(--deep);display:flex;align-items:center;gap:8px}
.cal .r{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;margin:10px 0}
</style></head><body>
<!-- Technical and content: one site structure across languages, the language
     versions linked to each other, healthy page speed, a publishing plan. -->
<svg class="abs" style="left:0;top:0" width="800" height="600">
  <path class="solid" d="M190 72 L190 120 M190 120 L46 120 L46 160 M190 120 L142 120 L142 160 M190 120 L238 120 L238 160 M190 120 L334 120 L334 160"/>
  <path class="link" d="M60 206 C 80 250, 120 250, 140 206"/>
  <path class="link" d="M156 206 C 176 250, 216 250, 236 206"/>
  <path class="link" d="M252 206 C 272 250, 312 250, 332 206"/>
  <path class="link" d="M50 208 C 120 300, 270 300, 330 208"/>
</svg>
<div class="card node" style="left:122px;top:24px">yoursite.com</div>
<div class="card node" style="left:12px;top:162px">/en/</div>
<div class="card node" style="left:110px;top:162px">/fr/</div>
<div class="card node" style="left:204px;top:162px">/de/</div>
<div class="card node" style="left:302px;top:162px">/es/</div>
<div class="pill berry abs" style="left:30px;top:310px">Language versions linked</div>

<div class="card pad abs" style="left:420px;top:10px;width:374px">
  <div class="h serif">Page speed, every language</div>
  <div class="cwv" style="margin-top:16px">
    <span>Main content shown</span><b><span class="dot ok"></span>1.9 s</b>
    <span>Response to a tap</span><b><span class="dot ok"></span>140 ms</b>
    <span>Layout stability</span><b><span class="dot ok"></span>0.03</b>
  </div>
</div>

<div class="card pad cal abs" style="left:300px;top:330px;width:494px">
  <div class="h serif">Publishing plan</div>
  <div class="r"><span class="lang">FR</span><div class="line ink" style="width:76%;margin:0"></div></div>
  <div class="r"><span class="lang">DE</span><div class="line" style="width:88%;margin:0"></div></div>
  <div class="r"><span class="lang">ES</span><div class="line" style="width:66%;margin:0"></div></div>
  <div class="r"><span class="lang">NL</span><div class="line berry" style="width:52%;margin:0"></div></div>
</div>
</body></html>
