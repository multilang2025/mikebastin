<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="800x600">
<link rel="stylesheet" href="../kit.css"><style>:root{--w:800px;--h:600px}
.fr{position:absolute;width:520px;height:186px}
.fr .t{font:600 19px/1.2 "Fraunces";color:var(--ink)}
.fr .b{padding:14px 20px 0}
.tld{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tld span{font:600 14px "Inter";padding:5px 10px;border-radius:8px;background:var(--chip);color:var(--ink);border:1px solid var(--rule)}
.tile{width:84px;height:70px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.sys{width:110px;white-space:nowrap;font:500 13px/1.3 "Inter";color:var(--dim);text-align:center;flex:none}
.sys div{height:60px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.rank.c{position:absolute}
</style></head><body>
<!-- Three multilingual sites, each a different shape. Generic frames labelled by
     situation; no client named. -->

<div class="card browser fr" style="left:4px;top:8px">
  <div class="bar"><i></i><i></i><i></i><span class="url">yoursite.com</span></div>
  <div class="b">
    <div style="display:flex;justify-content:space-between;align-items:center"><div class="t">Ten country domains</div><span class="pill berry" style="height:28px;font-size:13px;box-shadow:none">Linked by hreflang</span></div>
    <div class="tld"><span>.com</span><span>.us</span><span>.ca</span><span>.co.uk</span><span>.be</span><span>.fr</span><span>.es</span><span>.de</span><span>.nl</span><span>.it</span></div>
  </div>
</div>
<div class="rank c" style="left:506px;top:-4px">1</div>

<div class="card browser fr" style="left:140px;top:208px">
  <div class="bar"><i></i><i></i><i></i><span class="url">yoursite.com/properties/</span></div>
  <div class="b">
    <div class="t">Four languages on a property site</div>
    <div style="display:flex;gap:12px;margin-top:18px;align-items:center">
      <div class="tile"><svg width="46" height="46" viewBox="0 0 46 46"><path d="M5 22 L23 7 L41 22 L41 40 L5 40 Z" fill="var(--deep)" opacity=".88"/><rect x="19" y="26" width="9" height="14" fill="var(--cream)"/></svg></div>
      <div class="tile"><svg width="46" height="46" viewBox="0 0 46 46"><path d="M5 22 L23 7 L41 22 L41 40 L5 40 Z" fill="var(--berry)" opacity=".85"/><rect x="19" y="26" width="9" height="14" fill="var(--cream)"/></svg></div>
      <div class="tile"><svg width="46" height="46" viewBox="0 0 46 46"><path d="M5 22 L23 7 L41 22 L41 40 L5 40 Z" fill="var(--deep)" opacity=".6"/><rect x="19" y="26" width="9" height="14" fill="var(--cream)"/></svg></div>
      <div style="margin-left:14px;display:grid;grid-template-columns:repeat(2,auto);gap:8px;justify-content:start"><span class="lang">EN</span><span class="lang">FR</span><span class="lang">ES</span><span class="lang">DE</span></div>
    </div>
  </div>
</div>
<div class="rank c" style="left:642px;top:196px">2</div>

<div class="card browser fr" style="left:268px;top:408px">
  <div class="bar"><i></i><i></i><i></i><span class="url">yoursite.com/legal/</span></div>
  <div class="b">
    <div class="t">Four languages across two legal systems</div>
    <div style="display:flex;gap:12px;margin-top:14px;align-items:flex-start">
      <div style="display:grid;grid-template-columns:repeat(2,auto);gap:8px;justify-content:start;width:84px;padding-top:6px"><span class="lang">EN</span><span class="lang">FR</span><span class="lang">ES</span><span class="lang">RU</span></div>
      <div class="sys"><div><svg width="30" height="30" viewBox="0 0 30 30"><path d="M7 3 H19 L24 8 V27 H7 Z" fill="var(--deep)" opacity=".88"/><rect x="11" y="13" width="9" height="2.4" fill="var(--cream)"/><rect x="11" y="18" width="9" height="2.4" fill="var(--cream)"/></svg></div>Legal system 1</div>
      <div class="sys"><div><svg width="30" height="30" viewBox="0 0 30 30"><path d="M7 3 H19 L24 8 V27 H7 Z" fill="var(--berry)" opacity=".88"/><rect x="11" y="13" width="9" height="2.4" fill="var(--cream)"/><rect x="11" y="18" width="9" height="2.4" fill="var(--cream)"/></svg></div>Legal system 2</div>
      <div class="sys"><div><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="var(--deep)"/><path d="M3 22 C3 15 21 15 21 22 Z" fill="var(--deep)"/></svg></div>Bios per audience</div>
    </div>
  </div>
</div>
<div class="rank c" style="left:764px;top:396px">3</div>
</body></html>
